<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>王涛的自控笔记</title>
    <!-- CSS 部分同上，为了节省篇幅，省略，但实际要包含完整样式，我们在这里不省略 -->
    <style>
        /* 将之前的全部样式复制过来，确保样式完整 */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
            background: #f5f7fa;
            color: #1f2937;
            padding: 20px;
        }
        .container {
            max-width: 800px;
            margin: 0 auto;
            background: #ffffff;
            border-radius: 24px;
            padding: 40px 35px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.06);
        }
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            border-bottom: 2px solid #eef2f6;
            padding-bottom: 20px;
            margin-bottom: 30px;
        }
        .blog-title {
            font-size: 28px;
            font-weight: 700;
            background: linear-gradient(135deg, #3b82f6, #8b5cf6);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .weather-wrapper {
            position: relative;
            cursor: pointer;
            user-select: none;
        }
        .weather-display {
            background: #f0f4ff;
            padding: 10px 20px;
            border-radius: 40px;
            font-size: 16px;
            font-weight: 500;
            color: #1e40af;
            display: flex;
            align-items: center;
            gap: 8px;
            transition: background 0.2s;
        }
        .weather-display:hover {
            background: #dce6f5;
        }
        .weather-display .arrow {
            font-size: 12px;
            margin-left: 4px;
            transition: transform 0.25s;
        }
        .weather-display .arrow.open {
            transform: rotate(180deg);
        }
        .weather-settings {
            position: absolute;
            top: calc(100% + 8px);
            right: 0;
            background: white;
            border-radius: 16px;
            padding: 18px 20px;
            box-shadow: 0 12px 40px rgba(0, 0, 0, 0.12);
            min-width: 220px;
            display: none;
            z-index: 10;
            flex-direction: column;
            gap: 10px;
        }
        .weather-settings.open {
            display: flex;
        }
        .weather-settings button,
        .weather-settings select {
            background: #eef2f6;
            border: none;
            padding: 8px 14px;
            border-radius: 30px;
            font-size: 14px;
            cursor: pointer;
            color: #1f2937;
            outline: none;
            transition: 0.15s;
            width: 100%;
            text-align: left;
        }
        .weather-settings button:hover,
        .weather-settings select:hover {
            background: #dce2ec;
        }
        .weather-settings select {
            appearance: auto;
        }
        .post-list {
            margin-top: 10px;
        }
        .post {
            background: #fafbfc;
            border-radius: 16px;
            padding: 20px 24px;
            margin-bottom: 18px;
            border-left: 5px solid #3b82f6;
            transition: 0.2s;
        }
        .post:hover {
            background: #f0f4ff;
        }
        .post h3 {
            font-size: 20px;
            margin-bottom: 6px;
        }
        .post h3 a {
            color: #1f2937;
            text-decoration: none;
        }
        .post h3 a:hover {
            color: #3b82f6;
        }
        .post .meta {
            font-size: 14px;
            color: #6b7280;
        }
        .post .summary {
            margin-top: 8px;
            color: #4b5563;
            line-height: 1.6;
        }
        .static-post {
            border-left-color: #f59e0b;
            background: #fffbeb;
        }
        .empty-tip {
            text-align: center;
            color: #9ca3af;
            padding: 40px 0;
            background: #fafbfc;
            border-radius: 16px;
        }
        .empty-tip a {
            color: #3b82f6;
        }
        .comment-section {
            margin-top: 50px;
            padding-top: 30px;
            border-top: 2px solid #eef2f6;
        }
        .comment-section h2 {
            font-size: 22px;
            margin-bottom: 16px;
        }
        .comment-section .hint {
            font-size: 14px;
            color: #6b7280;
            background: #f3f4f6;
            padding: 12px 18px;
            border-radius: 12px;
            margin-bottom: 20px;
        }
        @media (max-width: 600px) {
            .container {
                padding: 20px 15px;
            }
            .header {
                flex-direction: column;
                align-items: flex-start;
                gap: 12px;
            }
            .blog-title {
                font-size: 24px;
            }
            .weather-settings {
                right: auto;
                left: 0;
                width: 100%;
            }
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="header">
            <div class="blog-title">📝 王涛的自控笔记</div>
            <div class="weather-wrapper" id="weatherWrapper">
                <div class="weather-display" id="weatherDisplay">
                    <span id="weatherIcon">☀️</span>
                    <span id="weatherCity">加载中</span>
                    <span id="weatherTemp">--°C</span>
                    <span class="arrow" id="arrowIcon">▾</span>
                </div>
                <div class="weather-settings" id="weatherSettings">
                    <button id="getLocationBtn">📍 获取当前位置</button>
                    <select id="citySelect">
                        <option value="">🌆 选择城市...</option>
                        <option value="39.9,116.4,北京">北京</option>
                        <option value="31.2,121.5,上海">上海</option>
                        <option value="23.1,113.3,广州">广州</option>
                        <option value="22.5,114.1,深圳">深圳</option>
                        <option value="30.6,114.3,武汉">武汉</option>
                        <option value="34.3,108.9,西安">西安</option>
                        <option value="30.6,104.1,成都">成都</option>
                        <option value="29.6,106.5,重庆">重庆</option>
                        <option value="32.1,118.8,南京">南京</option>
                        <option value="30.3,120.2,杭州">杭州</option>
                        <option value="36.1,120.4,青岛">青岛</option>
                        <option value="43.8,87.6,乌鲁木齐">乌鲁木齐</option>
                        <option value="45.8,126.5,哈尔滨">哈尔滨</option>
                        <option value="25.0,121.5,台北">台北</option>
                        <option value="22.3,114.2,香港">香港</option>
                        <option value="21.2,110.4,海口">海口</option>
                    </select>
                </div>
            </div>
        </div>

        <h2 style="margin-bottom:18px; font-size:20px;">📖 最新文章</h2>
        <div class="post-list">
            <!-- 静态文章 -->
            <div class="post static-post" id="staticPost">
                <h3><a href="#">📌 关于我</a></h3>
                <div class="meta">📅 固定 ｜ 💬 0</div>
                <div class="summary">
                    我是王涛，一名自控领域的爱好者。这个博客用于记录我的学习笔记、项目经验和技术思考。欢迎交流！
                    <br>
                    （你可以修改这段文字，位于 <code>index.html</code> 的静态文章区域。）
                </div>
            </div>
            <!-- 动态文章将加载到这里 -->
            <div id="dynamicPosts"></div>
        </div>

        <div class="comment-section">
            <h2>💬 留言板</h2>
            <div class="hint">
                👋 欢迎留言！你需要登录 <strong>GitHub</strong> 账号才能发表评论。<br />
                （留言板功能尚未配置，稍后可以激活 Giscus。）
            </div>
            <div style="text-align:center; padding:20px 0; color:#9ca3af;">
                ⚙️ 留言板配置教程待补充
            </div>
        </div>
    </div>

    <script>
        // ================================================================
        // GitHub 配置
        // ================================================================
        const GITHUB_USERNAME = 'traviswongm';
        const GITHUB_REPO = 'my-blog';
        // 👇 请把你生成的 Token 替换到下面这行（保留单引号），确保 Token 值不包含任何中文或特殊符号
        const GITHUB_TOKEN = '这里替换成你的真实token'; // 例如 'ghp_abcdef123456...'

        // ---------- 天气逻辑 ----------
        const weatherIcon = document.getElementById('weatherIcon');
        const weatherCity = document.getElementById('weatherCity');
        const weatherTemp = document.getElementById('weatherTemp');
        const arrowIcon = document.getElementById('arrowIcon');
        const weatherWrapper = document.getElementById('weatherWrapper');
        const weatherSettings = document.getElementById('weatherSettings');
        const citySelect = document.getElementById('citySelect');
        const getLocationBtn = document.getElementById('getLocationBtn');

        const DEFAULT_LAT = 39.9;
        const DEFAULT_LON = 116.4;
        const DEFAULT_CITY = '北京';

        function fetchWeather(lat, lon, cityName) {
            const url =
                `https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&current_weather=true&timezone=auto`;
            weatherCity.textContent = '加载中...';
            weatherTemp.textContent = '--°C';
            fetch(url)
                .then(res => res.json())
                .then(data => {
                    const w = data.current_weather;
                    const temp = Math.round(w.temperature);
                    const code = w.weathercode;
                    const emoji = getWeatherEmoji(code);
                    if (cityName) {
                        updateDisplay(emoji, cityName, temp);
                    } else {
                        reverseGeocode(lat, lon, emoji, temp);
                    }
                })
                .catch(() => {
                    weatherCity.textContent = '加载失败';
                    weatherTemp.textContent = '--°C';
                });
        }

        function reverseGeocode(lat, lon, emoji, temp) {
            const url =
                `https://nominatim.openstreetmap.org/reverse?format=json&lat=${lat}&lon=${lon}&zoom=10&accept-language=zh`;
            fetch(url, { headers: { 'User-Agent': 'MyBlog/1.0' } })
                .then(res => res.json())
                .then(data => {
                    let city = '当前位置';
                    if (data.address) {
                        city = data.address.city || data.address.town || data.address.village || data.address.county ||
                            '当前位置';
                    }
                    updateDisplay(emoji, city, temp);
                })
                .catch(() => updateDisplay(emoji, '当前位置', temp));
        }

        function updateDisplay(emoji, city, temp) {
            weatherIcon.textContent = emoji;
            weatherCity.textContent = city;
            weatherTemp.textContent = temp + '°C';
        }

        function getWeatherEmoji(code) {
            if (code === 0) return '☀️';
            if (code <= 3) return '⛅';
            if (code <= 20) return '🌧️';
            if (code <= 30) return '🌨️';
            if (code <= 50) return '🌫️';
            return '🌤️';
        }

        function locateAndFetch() {
            if (!navigator.geolocation) {
                weatherCity.textContent = '不支持定位';
                fetchWeather(DEFAULT_LAT, DEFAULT_LON, DEFAULT_CITY);
                return;
            }
            weatherCity.textContent = '定位中...';
            weatherTemp.textContent = '--°C';
            navigator.geolocation.getCurrentPosition(
                (pos) => {
                    const lat = pos.coords.latitude;
                    const lon = pos.coords.longitude;
                    citySelect.value = '';
                    fetchWeather(lat, lon, null);
                },
                () => {
                    weatherCity.textContent = '定位失败，使用默认';
                    fetchWeather(DEFAULT_LAT, DEFAULT_LON, DEFAULT_CITY);
                }
            );
        }

        citySelect.addEventListener('change', function() {
            const val = this.value;
            if (!val) return;
            const parts = val.split(',');
            fetchWeather(parseFloat(parts[0]), parseFloat(parts[1]), parts[2]);
            closeSettings();
        });
        getLocationBtn.addEventListener('click', function() {
            locateAndFetch();
            closeSettings();
        });
        weatherWrapper.addEventListener('click', function(e) {
            if (e.target.closest('button') || e.target.closest('select')) return;
            weatherSettings.classList.toggle('open');
            arrowIcon.classList.toggle('open');
        });
        document.addEventListener('click', function(e) {
            if (!weatherWrapper.contains(e.target)) {
                weatherSettings.classList.remove('open');
                arrowIcon.classList.remove('open');
            }
        });

        window.addEventListener('load', function() {
            if (navigator.geolocation) {
                locateAndFetch();
            } else {
                fetchWeather(DEFAULT_LAT, DEFAULT_LON, DEFAULT_CITY);
            }
            loadPosts();
        });

        // ---------- 动态文章加载（使用 Token 认证） ----------
        function loadPosts() {
            var dynamicContainer = document.getElementById('dynamicPosts');

            // 检查 Token 是否已配置
            if (!GITHUB_TOKEN || GITHUB_TOKEN === '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') {
                dynamicContainer.innerHTML = 
                    '<div class="empty-tip">' +
                        '⚠️ 请先在代码中配置 <code style="background:#eef2f6;padding:2px 8px;border-radius:4px;">GITHUB_TOKEN</code><br>' +
                        '在 GitHub → Settings → Developer settings → Personal access tokens 中生成' +
                    '</div>';
                return;
            }

            var apiUrl = 'https://api.github.com/repos/' + GITHUB_USERNAME + '/' + GITHUB_REPO + 
                         '/issues?labels=post&state=open&per_page=20&sort=created&direction=desc';

            // 使用简单的 headers 对象，确保所有键和值都是纯 ASCII 字符串
            var headers = new Headers();
            headers.append('Authorization', 'Bearer ' + GITHUB_TOKEN);
            headers.append('User-Agent', 'MyBlog/1.0');
            headers.append('Accept', 'application/vnd.github.v3+json');

            fetch(apiUrl, { headers: headers })
            .then(function(response) {
                if (!response.ok) {
                    throw new Error('HTTP error ' + response.status);
                }
                return response.json();
            })
            .then(function(issues) {
                if (!Array.isArray(issues) || issues.length === 0) {
                    dynamicContainer.innerHTML = 
                        '<div class="empty-tip">' +
                            '📭 动态文章还没有哦～<br>' +
                            '去你的 GitHub 仓库 <a href="https://github.com/' + GITHUB_USERNAME + '/' + GITHUB_REPO + '/issues" target="_blank">创建一个 Issue</a>，<br>' +
                            '并给它打上 <strong>post</strong> 标签，就会自动显示在这里！' +
                        '</div>';
                    return;
                }

                var html = '';
                issues.forEach(function(issue) {
                    var summary = issue.body || '';
                    summary = summary.replace(/#/g, '').trim();
                    if (summary.length > 80) summary = summary.substring(0, 80) + '...';
                    var date = new Date(issue.created_at).toLocaleDateString('zh-CN');
                    var commentCount = issue.comments;
                    html += 
                        '<div class="post">' +
                            '<h3><a href="' + issue.html_url + '" target="_blank">' + issue.title + '</a></h3>' +
                            '<div class="meta">📅 ' + date + ' ｜ 💬 ' + commentCount + ' 条留言</div>' +
                            '<div class="summary">' + (summary || '（点击标题查看全文）') + '</div>' +
                        '</div>';
                });
                dynamicContainer.innerHTML = html;
            })
            .catch(function(err) {
                console.error('加载文章出错:', err);
                dynamicContainer.innerHTML = 
                    '<div class="empty-tip">' +
                        '⚠️ 动态文章加载失败，请稍后重试。<br>' +
                        '<span style="font-size:13px;color:#9ca3af;">错误信息：' + err.message + '</span>' +
                    '</div>';
            });
        }
    </script>
</body>
</html>
